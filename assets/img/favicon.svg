<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pixmakers Factory">
  <!-- Three pixels of four. Sharp corners, one accent — the mark is the idea:
       Pixmakers deals in pixels. Legible down to 16px, where a letterform
       would turn to mush. -->
  <rect width="32" height="32" fill="#0b0b0b"/>
  <rect x="3"  y="3"  width="12" height="12" fill="#ff2e88"/>
  <rect x="17" y="3"  width="12" height="12" fill="#ff2e88"/>
  <rect x="3"  y="17" width="12" height="12" fill="#ff2e88"/>
</svg>
